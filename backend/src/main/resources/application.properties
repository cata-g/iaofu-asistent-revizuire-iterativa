spring.application.name=backend

# Local development defaults to in-memory H2; docker compose overrides these with PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:h2:mem:reviewer;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema (db/migration); Hibernate does not create or validate it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Health endpoint at /api/health
management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health

# Piston and the problem set
reviewer.piston.url=${PISTON_URL:http://localhost:2000}
reviewer.problems.dir=${PROBLEMS_DIR:../problems}

# LLM: the key comes only from the environment (.env); prices are per million tokens
reviewer.llm.api-key=${ANTHROPIC_API_KEY:}
reviewer.llm.model=${LLM_MODEL:claude-haiku-5-5}
reviewer.llm.budget-usd=${LLM_BUDGET_USD:1.00}
reviewer.llm.input-usd-per-mtok=${LLM_INPUT_USD_PER_MTOK:0.10}
reviewer.llm.output-usd-per-mtok=${LLM_OUTPUT_USD_PER_MTOK:0.50}
