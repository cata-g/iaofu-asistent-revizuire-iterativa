spring.application.name=backend

# Local development defaults to in-memory H2; docker compose overrides these with PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:h2:mem:reviewer;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Health endpoint at /api/health
management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health

# Piston and the problem set
reviewer.piston.url=${PISTON_URL:http://localhost:2000}
reviewer.problems.dir=${PROBLEMS_DIR:../problems}
